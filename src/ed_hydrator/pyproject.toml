[project]
name = "ed-hydrator"
version = "0.1.0"
description = "Lightweight on-demand domain hydration library transforming ed-telemetry endpoints into typed ed-models entities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ed-models",
    "ed-telemetry-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
