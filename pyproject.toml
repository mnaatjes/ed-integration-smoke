[project]
name = "ed-integration-smoke"
version = "0.1.0"
description = "Fleet-wide integration, smoke testing, and experimental harness for Elite Dangerous libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ed-schema",
    "ed-transport",
    "ed-models",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
    "jsonschema>=4.20.0",
    "types-jsonschema>=4.20.0",
]

[tool.uv.sources]
ed-schema = { git = "https://github.com/mnaatjes/ed-schema.git", tag = "v1.1.0" }
ed-transport = { git = "https://github.com/mnaatjes/ed-transport.git", branch = "main" }
ed-models = { git = "https://github.com/mnaatjes/ed-models.git", tag = "v0.2.0" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "ed_schema.*",
    "ed_schema",
    "ed_transport.*",
    "ed_transport",
    "ed_models.*",
    "ed_models",
]
ignore_missing_imports = true
