[project]
name = "ed-integration-smoke"
version = "0.2.0"
description = "Fleet-wide integration, smoke testing, and experimental harness for Elite Dangerous libraries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ed-schema",
    "ed-transport",
    "ed-models",
    "ed-resolver",
    "ed-telemetry",
    "ed-telemetry-client",
    "ed-cli-core",
    "ed-hydrator",
    "ed-stream-monitor",
    "ed-reducer",
    "ed-dispatcher",
    "rich>=13.0.0",
    "typer>=0.15.0",
    "textual>=1.0.0",
]

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
ed-dispatcher = { workspace = true }
ed-reducer = { workspace = true }
ed-stream-monitor = { workspace = true }
ed-hydrator = { workspace = true }
ed-cli-core = { workspace = true }
ed-telemetry-client = { workspace = true }
ed-schema = { git = "https://github.com/mnaatjes/ed-schema.git", tag = "v1.1.0" }
ed-transport = { git = "https://github.com/mnaatjes/ed-transport.git", branch = "main" }
ed-models = { git = "https://github.com/mnaatjes/ed-models.git", rev = "v0.2.1" }
ed-resolver = { git = "https://github.com/mnaatjes/ed-resolver.git", tag = "v0.2.0" }
ed-telemetry = { git = "https://github.com/mnaatjes/ed-telemetry.git", tag = "v0.10.0" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "ed_schema.*",
    "ed_schema",
    "ed_transport.*",
    "ed_transport",
    "ed_models.*",
    "ed_models",
    "ed_resolver.*",
    "ed_resolver",
    "ed_telemetry.*",
    "ed_telemetry",
]
ignore_missing_imports = true
